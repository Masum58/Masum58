name: Generate GitHub README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
      - master

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create profile-stats directory
        run: mkdir -p profile-stats

      - name: Generate GitHub Stats Card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117'
          path: profile-stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Streak Stats Card
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile-stats/streak.svg
          theme: tokyonight
          background: 0D1117
          hide-border: true

      - name: Generate GitHub Trophy Card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&row=1'
          path: profile-stats/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats/*.svg
          git commit -m "chore: update github stats cards" || exit 0
          git push
