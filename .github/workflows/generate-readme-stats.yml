name: Generate GitHub README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
      - master

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: profile-stats-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create profile-stats directory
        run: mkdir -p profile-stats

      - name: Generate GitHub Trophy Card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&row=1'
          path: profile-stats/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("profile-stats/trophy.svg")
          content = path.read_text(encoding="utf-8")
          ET.fromstring(content)
          if any(marker in content.lower() for marker in (
              "something went wrong", "resource not accessible", "forbidden"
          )):
              raise SystemExit(f"Generated card contains an error response: {path}")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats/*.svg
          if git diff --cached --quiet; then
            echo "No profile stats changed."
            exit 0
          fi
          git commit -m "chore: update github stats cards"
          git push
